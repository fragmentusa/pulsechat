<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Pulse Chat</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pulse">
<meta name="theme-color" content="#F6F5F1">
<link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">

<style>
  :root{
    --paper:#F6F5F1;
    --paper-2:#EFEDE6;
    --ink:#1B2430;
    --ink-soft:#5B6472;
    --line:#DFDCD2;
    --pulse:#E63950;
    --pulse-soft:#FBE3E6;
    --teal:#1F8C7D;
    --teal-soft:#E1F3EF;
    --mono: 'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    font-family:var(--sans);
    color:var(--ink);
    overflow:hidden;
  }
  #app{
    display:flex; flex-direction:column;
    height:100vh; height:100dvh;
    max-width:560px; margin:0 auto;
    background:var(--paper);
    position:relative;
  }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    background:var(--paper);
    opacity:0; pointer-events:none;
    transition:opacity .35s ease;
  }
  .screen.active{ opacity:1; pointer-events:auto; }

  /* ---------- SPLASH ---------- */
  #screen-splash{
    align-items:center; justify-content:center;
    gap:22px;
  }
  .pulse-mark{
    width:64px; height:64px; border-radius:50%;
    background:var(--pulse-soft);
    display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  .pulse-mark::before{
    content:''; position:absolute; inset:0; border-radius:50%;
    border:1.5px solid var(--pulse);
    animation:ring 1.6s ease-out infinite;
  }
  .pulse-mark svg{ width:26px; height:26px; }
  @keyframes ring{
    0%{ transform:scale(.8); opacity:.9; }
    100%{ transform:scale(1.9); opacity:0; }
  }
  #screen-splash h1{ font-size:20px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  #screen-splash .sub{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); }
  .splash-ekg{ width:160px; height:26px; overflow:hidden; }
  .splash-ekg svg{ display:block; width:200%; height:100%; }
  .splash-ekg path{ fill:none; stroke:var(--pulse); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .splash-ekg g{ animation: ekgmove 4.2s linear infinite; }
  @keyframes ekgmove{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  /* ---------- AUTH SCREENS ---------- */
  .auth-body{
    flex:1; display:flex; flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 40px) 26px 26px;
  }
  .auth-body h2{ font-size:22px; font-weight:700; margin:18px 0 6px; letter-spacing:-0.01em; }
  .auth-body p.desc{ font-size:14.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 28px; }
  .auth-icon{
    width:52px; height:52px; border-radius:16px;
    background:var(--pulse-soft); color:var(--pulse);
    display:flex; align-items:center; justify-content:center;
  }
  .auth-icon svg{ width:24px; height:24px; }

  .phone-row{
    display:flex; align-items:center; gap:10px;
    border:1px solid var(--line); border-radius:14px;
    padding:4px 6px; background:#fff;
  }
  .cc{
    font-family:var(--mono); font-size:16px; font-weight:700;
    color:var(--ink); padding:10px 10px 10px 12px;
    border-right:1px solid var(--line);
  }
  #phone-input{
    flex:1; border:none; outline:none; background:transparent;
    font-family:var(--mono); font-size:17px; letter-spacing:0.03em;
    padding:10px 8px; color:var(--ink);
  }
  .code-boxes{ display:flex; gap:10px; margin-top:4px; }
  .code-box{
    width:46px; height:56px; border:1px solid var(--line); border-radius:12px;
    background:#fff; text-align:center; font-family:var(--mono); font-size:22px;
    font-weight:700; outline:none; color:var(--ink);
  }
  .code-box:focus{ border-color:var(--pulse); }
  .code-box.err{ animation:shake .3s; border-color:var(--pulse); }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }
  .hint{ font-size:12.5px; color:var(--ink-soft); margin-top:16px; }
  .hint b{ color:var(--ink); font-weight:700; }
  .err-msg{
    font-size:13px; color:var(--pulse); margin-top:12px; min-height:16px;
  }

  .auth-btn{
    margin-top:auto;
    width:100%; border:none; border-radius:14px;
    background:var(--pulse); color:#fff;
    font-size:16px; font-weight:700;
    padding:15px; cursor:pointer;
  }
  .auth-btn:disabled{ background:var(--line); color:var(--ink-soft); }
  .auth-btn:active:not(:disabled){ transform:scale(.985); }
  .back-link{
    background:none; border:none; color:var(--ink-soft);
    font-size:13.5px; padding:14px 0 0; text-align:center; cursor:pointer;
  }

  /* ---------- CHAT (same as before) ---------- */
  #screen-chat{ }
  header{
    flex:none;
    padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;
    background:var(--paper);
    border-bottom:1px solid var(--line);
    position:relative; z-index:2;
  }
  .htop{ display:flex; align-items:center; justify-content:space-between; }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand h1{ font-size:19px; font-weight:700; margin:0; letter-spacing:-0.01em; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--teal); box-shadow:0 0 0 3px var(--teal-soft); flex:none; }
  .bpm{ font-family:var(--mono); font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:5px; }
  .bpm b{ color:var(--pulse); font-weight:700; }
  #logout-btn{ background:none; border:none; color:var(--ink-soft); padding:4px; cursor:pointer; }
  #logout-btn svg{ width:19px; height:19px; }

  #ekg-wrap{ margin-top:10px; height:34px; width:100%; overflow:hidden; }
  #ekg-wrap svg{ display:block; width:200%; height:100%; }
  #ekg-path{ fill:none; stroke:var(--pulse); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  #ekg-track{ animation: ekgmove 4.2s linear infinite; }

  #scroll{ flex:1; overflow-y:auto; padding:18px 16px 10px; -webkit-overflow-scrolling:touch; }
  .day-divider{ display:flex; align-items:center; gap:10px; margin:18px 0 14px; color:var(--ink-soft); font-size:12px; font-family:var(--mono); }
  .day-divider::before, .day-divider::after{ content:''; flex:1; height:1px; background:var(--line); }
  .row{ display:flex; margin-bottom:8px; animation: rise .25s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .row.mine{ justify-content:flex-end; }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:16px; font-size:15.5px; line-height:1.42; position:relative; word-wrap:break-word; white-space:pre-wrap; }
  .row.mine .bubble{ background:var(--pulse); color:#fff; border-bottom-right-radius:5px; }
  .row:not(.mine) .bubble{ background:var(--paper-2); color:var(--ink); border-bottom-left-radius:5px; }
  .meta{ font-family:var(--mono); font-size:10.5px; opacity:.65; margin-top:4px; display:block; }
  .row.mine .meta{ color:#fff; text-align:right; }
  .row:not(.mine) .meta{ color:var(--ink-soft); }
  .bubble{ transition:opacity .15s; }
  .bubble:active{ opacity:.75; }
  #empty{ text-align:center; color:var(--ink-soft); font-size:14px; margin-top:60px; line-height:1.6; }
  #empty .big{ font-size:32px; display:block; margin-bottom:10px; }

  #composer{ flex:none; display:flex; align-items:flex-end; gap:8px; padding:10px 12px calc(env(safe-area-inset-bottom) + 10px); background:var(--paper); border-top:1px solid var(--line); }
  #text{ flex:1; resize:none; border:1px solid var(--line); background:#fff; border-radius:20px; padding:10px 15px; font-size:15.5px; font-family:var(--sans); max-height:120px; line-height:1.4; color:var(--ink); outline:none; }
  #text:focus{ border-color:var(--pulse); }
  #send{ flex:none; width:38px; height:38px; border-radius:50%; border:none; background:var(--pulse); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  #send:active{ transform:scale(.92); }
  #send svg{ width:17px; height:17px; }
  #send:disabled{ background:var(--line); }
</style>
</head>
<body>
<div id="app">

  <!-- SPLASH -->
  <div id="screen-splash" class="screen active">
    <div class="pulse-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="var(--pulse)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>
    </div>
    <h1>Pulse Chat</h1>
    <div class="splash-ekg">
      <svg viewBox="0 0 400 26" preserveAspectRatio="none">
        <g>
          <path d="M0,13 L40,13 L52,13 L58,3 L64,23 L70,13 L100,13 L140,13 L152,13 L158,3 L164,23 L170,13 L200,13 L240,13 L252,13 L258,3 L264,23 L270,13 L300,13 L340,13 L352,13 L358,3 L364,23 L370,13 L400,13" transform="translate(0,0)"/>
          <path d="M0,13 L40,13 L52,13 L58,3 L64,23 L70,13 L100,13 L140,13 L152,13 L158,3 L164,23 L170,13 L200,13 L240,13 L252,13 L258,3 L264,23 L270,13 L300,13 L340,13 L352,13 L358,3 L364,23 L370,13 L400,13" transform="translate(400,0)"/>
        </g>
      </svg>
    </div>
    <div class="sub">запуск…</div>
  </div>

  <!-- PHONE SCREEN -->
  <div id="screen-phone" class="screen">
    <div class="auth-body">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.9.34 1.79.65 2.65a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.43-1.43a2 2 0 0 1 2.11-.45c.86.31 1.75.53 2.65.65A2 2 0 0 1 22 16.92z"/></svg>
      </div>
      <h2>Твой номер</h2>
      <p class="desc">Введи номер телефона, чтобы войти в Pulse Chat.</p>

      <div class="phone-row">
        <span class="cc">+888</span>
        <input id="phone-input" type="tel" inputmode="numeric" placeholder="0000 0000" maxlength="9">
      </div>
      <div class="err-msg" id="phone-err"></div>
      <div class="hint">Вход только по личному номеру.</div>

      <button class="auth-btn" id="phone-continue" disabled>Продолжить</button>
    </div>
  </div>

  <!-- CODE SCREEN -->
  <div id="screen-code" class="screen">
    <div class="auth-body">
      <div class="auth-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2>Код подтверждения</h2>
      <p class="desc" id="code-desc">Отправили код на <b id="code-phone-shown"></b></p>

      <div class="code-boxes" id="code-boxes">
        <input class="code-box" type="tel" inputmode="numeric" maxlength="1">
        <input class="code-box" type="tel" inputmode="numeric" maxlength="1">
        <input class="code-box" type="tel" inputmode="numeric" maxlength="1">
        <input class="code-box" type="tel" inputmode="numeric" maxlength="1">
        <input class="code-box" type="tel" inputmode="numeric" maxlength="1">
      </div>
      <div class="err-msg" id="code-err"></div>

      <button class="back-link" id="code-back">Изменить номер</button>
    </div>
  </div>

  <!-- CHAT -->
  <div id="screen-chat" class="screen">
    <header>
      <div class="htop">
        <div class="brand">
          <span class="dot"></span>
          <h1>Pulse Chat</h1>
        </div>
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="bpm"><b id="bpm-count">72</b> bpm</div>
          <button id="logout-btn" aria-label="Выйти">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
      </div>
      <div id="ekg-wrap">
        <svg viewBox="0 0 400 34" preserveAspectRatio="none">
          <g id="ekg-track">
            <path id="ekg-path" d="M0,17 L40,17 L52,17 L58,4 L64,30 L70,17 L100,17 L140,17 L152,17 L158,4 L164,30 L170,17 L200,17 L240,17 L252,17 L258,4 L264,30 L270,17 L300,17 L340,17 L352,17 L358,4 L364,30 L370,17 L400,17" transform="translate(0,0)"/>
            <path d="M0,17 L40,17 L52,17 L58,4 L64,30 L70,17 L100,17 L140,17 L152,17 L158,4 L164,30 L170,17 L200,17 L240,17 L252,17 L258,4 L264,30 L270,17 L300,17 L340,17 L352,17 L358,4 L364,30 L370,17 L400,17" transform="translate(400,0)" fill="none" stroke="var(--pulse)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
    </header>

    <div id="scroll">
      <div id="empty">
        <span class="big">◟◝</span>
        Пока тишина.<br>Напиши первую запись — она сохранится здесь навсегда.
      </div>
      <div id="list"></div>
    </div>

    <div id="composer">
      <textarea id="text" rows="1" placeholder="Сообщение…"></textarea>
      <button id="send" aria-label="Отправить" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
  </div>

</div>

<script>
const VALID_PHONE = '8880000000'; // +888 0000 0000
const VALID_CODE = '96844';
const STORAGE_KEY = 'pulse-messages';
const AUTH_KEY = 'pulse-auth';

const hasClaudeStorage = typeof window.storage !== 'undefined' && window.storage;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function getAuth(){
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get(AUTH_KEY, false);
      return res && res.value === 'true';
    }
    return localStorage.getItem(AUTH_KEY) === 'true';
  }catch(e){ return false; }
}
async function setAuth(val){
  try{
    if(hasClaudeStorage){
      await window.storage.set(AUTH_KEY, val ? 'true' : 'false', false);
    }else{
      localStorage.setItem(AUTH_KEY, val ? 'true' : 'false');
    }
  }catch(e){}
}

/* ---------- PHONE SCREEN LOGIC ---------- */
const phoneInput = document.getElementById('phone-input');
const phoneContinue = document.getElementById('phone-continue');
const phoneErr = document.getElementById('phone-err');

phoneInput.addEventListener('input', ()=>{
  let digits = phoneInput.value.replace(/\D/g,'').slice(0,8);
  phoneInput.value = digits.length > 4 ? digits.slice(0,4)+' '+digits.slice(4) : digits;
  phoneContinue.disabled = digits.length !== 8;
  phoneErr.textContent = '';
});

phoneContinue.addEventListener('click', ()=>{
  const digits = phoneInput.value.replace(/\D/g,'');
  if('888'+digits !== VALID_PHONE){
    phoneErr.textContent = 'Этот номер не привязан к Pulse Chat.';
    return;
  }
  document.getElementById('code-phone-shown').textContent = '+888 ' + phoneInput.value;
  show('screen-code');
  setTimeout(()=> codeBoxes[0].focus(), 300);
});

/* ---------- CODE SCREEN LOGIC ---------- */
const codeBoxes = Array.from(document.querySelectorAll('.code-box'));
const codeErr = document.getElementById('code-err');

codeBoxes.forEach((box, i)=>{
  box.addEventListener('input', ()=>{
    box.value = box.value.replace(/\D/g,'').slice(0,1);
    codeErr.textContent = '';
    if(box.value && i < codeBoxes.length - 1){
      codeBoxes[i+1].focus();
    }
    if(codeBoxes.every(b=>b.value)){
      checkCode();
    }
  });
  box.addEventListener('keydown', (e)=>{
    if(e.key === 'Backspace' && !box.value && i > 0){
      codeBoxes[i-1].focus();
    }
  });
});

async function checkCode(){
  const entered = codeBoxes.map(b=>b.value).join('');
  if(entered === VALID_CODE){
    await setAuth(true);
    enterChat();
  }else{
    codeBoxes.forEach(b=>{ b.classList.add('err'); });
    codeErr.textContent = 'Неверный код. Попробуй ещё раз.';
    setTimeout(()=>{
      codeBoxes.forEach(b=>{ b.value=''; b.classList.remove('err'); });
      codeBoxes[0].focus();
    }, 350);
  }
}

document.getElementById('code-back').addEventListener('click', ()=>{
  codeBoxes.forEach(b=> b.value = '');
  show('screen-phone');
});

document.getElementById('logout-btn').addEventListener('click', async ()=>{
  if(!confirm('Выйти из Pulse Chat?')) return;
  await setAuth(false);
  phoneInput.value = '';
  phoneContinue.disabled = true;
  codeBoxes.forEach(b=> b.value = '');
  show('screen-phone');
});

/* ---------- CHAT LOGIC ---------- */
const list = document.getElementById('list');
const scrollBox = document.getElementById('scroll');
const emptyState = document.getElementById('empty');
const textEl = document.getElementById('text');
const sendBtn = document.getElementById('send');
const bpmCount = document.getElementById('bpm-count');

let messages = [];

async function loadMessages(){
  try{
    if(hasClaudeStorage){
      const res = await window.storage.get(STORAGE_KEY, false);
      messages = res && res.value ? JSON.parse(res.value) : [];
    }else{
      const raw = localStorage.getItem(STORAGE_KEY);
      messages = raw ? JSON.parse(raw) : [];
    }
  }catch(e){
    messages = [];
  }
  render();
}

async function saveMessages(){
  try{
    if(hasClaudeStorage){
      await window.storage.set(STORAGE_KEY, JSON.stringify(messages), false);
    }else{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
    }
  }catch(e){
    console.error('Storage error', e);
  }
}

function fmtTime(ts){
  const d = new Date(ts);
  return d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'});
}
function fmtDay(ts){
  const d = new Date(ts);
  const today = new Date();
  const yest = new Date(); yest.setDate(today.getDate()-1);
  const sameDay = (a,b)=> a.toDateString() === b.toDateString();
  if(sameDay(d, today)) return 'сегодня';
  if(sameDay(d, yest)) return 'вчера';
  return d.toLocaleDateString('ru-RU', {day:'numeric', month:'long'});
}

function render(){
  list.innerHTML = '';
  emptyState.style.display = messages.length ? 'none' : 'block';

  let lastDay = null;
  messages.forEach(m=>{
    const day = fmtDay(m.ts);
    if(day !== lastDay){
      const div = document.createElement('div');
      div.className = 'day-divider';
      div.textContent = day;
      list.appendChild(div);
      lastDay = day;
    }
    const row = document.createElement('div');
    row.className = 'row mine';
    row.innerHTML = `<div class="bubble">${escapeHtml(m.text)}<span class="meta">${fmtTime(m.ts)}</span></div>`;
    let pressTimer;
    row.addEventListener('touchstart', ()=>{ pressTimer = setTimeout(()=>deleteMessage(m.id), 600); });
    row.addEventListener('touchend', ()=> clearTimeout(pressTimer));
    row.addEventListener('contextmenu', e=>{ e.preventDefault(); deleteMessage(m.id); });
    list.appendChild(row);
  });

  requestAnimationFrame(()=>{ scrollBox.scrollTop = scrollBox.scrollHeight; });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function deleteMessage(id){
  if(!confirm('Удалить запись?')) return;
  messages = messages.filter(m=>m.id !== id);
  await saveMessages();
  render();
}

async function sendMessage(){
  const val = textEl.value.trim();
  if(!val) return;
  messages.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), text: val, ts: Date.now() });
  textEl.value = '';
  autoGrow();
  updateSendState();
  await saveMessages();
  render();
  pulseBeat();
}

function pulseBeat(){
  bpmCount.textContent = 68 + Math.floor(Math.random()*10);
}

function autoGrow(){
  textEl.style.height = 'auto';
  textEl.style.height = Math.min(textEl.scrollHeight, 120) + 'px';
}
function updateSendState(){
  sendBtn.disabled = !textEl.value.trim();
}

textEl.addEventListener('input', ()=>{ autoGrow(); updateSendState(); });
textEl.addEventListener('keydown', (e)=>{
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
});
sendBtn.addEventListener('click', sendMessage);

async function enterChat(){
  show('screen-chat');
  await loadMessages();
}

/* ---------- BOOT ---------- */
(async function boot(){
  const authed = await getAuth();
  setTimeout(async ()=>{
    if(authed){
